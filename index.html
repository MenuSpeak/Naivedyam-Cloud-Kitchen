<!DOCTYPE html>
<html lang="en">   
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NAIVEDYAM</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0b0d;
            --surface: #0f1114;
            --muted: #9aa0a6;
            --gold1: #d4af37;
            --gold2: #ffcc66;
            --accent: linear-gradient(90deg, var(--gold1), var(--gold2));
            --glass: rgba(255, 255, 255, 0.03);
            --card-radius: 16px;
            --shadow: 0 10px 30px rgba(2, 6, 23, 0.6);
            --glass-strong: rgba(255, 255, 255, 0.04);
            --maxw: 1200px;
            --gap: 20px;
            --ff-heading: 'Playfair Display', serif;
            --ff-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            --orange: #ff9800;
            --green: #4CAF50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-size: 16px;
        }

        body {
            position: relative;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('bg.png') no-repeat center center/cover;
            filter: grayscale(100%);
            opacity: 0.5;
            z-index: -1;
        }

        body {
            background: radial-gradient(1200px 600px at 10% 10%, rgba(212, 175, 55, 0.06), transparent 6%),
                        radial-gradient(1000px 500px at 95% 90%, rgba(255, 204, 102, 0.04), transparent 8%),
                        var(--bg);
            color: #e8e6e3;
            font-family: var(--ff-ui);
            -webkit-font-smoothing: antialiased;
            padding: 16px;
            display: flex;
            justify-content: center;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: var(--maxw);
            display: flex;
            flex-direction: column;
            gap: var(--gap);
        }
  
        .cafe-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        .cafe-name {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--gold1);
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
            line-height: 1;
            margin-bottom: 5px;
            position: relative;
            display: inline-block;
        }

        .cafe-name::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 2px;
            background: var(--gold1);
        }

        .cafe-subtitle {
            font-size: 1.2rem;
            color: var(--orange);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 10px;
        }

        .location-info {
            font-size: 1rem;
            margin-top: 15px;
            line-height: 1.6;
        }

        .location-text {
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .address {
            color: var(--green);
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 8px;
        }

        .mobile-numbers {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 15px;
        }

        .veg-nonveg {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }

        .veg, .nonveg {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .veg { color: #2e7d32; background: rgba(46, 125, 50, 0.1); }
        .nonveg { color: #c62828; background: rgba(198, 40, 40, 0.1); }
        .veg:hover, .nonveg:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
        .symbol { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
        .veg .symbol { background: #4caf50; border: 2px solid #2e7d32; }
        .nonveg .symbol { background: #f44336; border: 2px solid #c62828; }

        .location-link-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(6px);
            text-align: center;
        }

        .location-link-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .location-link-header h3 {
            font-family: var(--ff-heading);
            color: var(--gold2);
            font-size: 1.3rem;
            margin: 0;
        }

        .map-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(90deg, var(--gold1), var(--gold2));
            color: #0b0b0d;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .map-link:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3); }

        .header { display: flex; flex-direction: column; gap: 16px; margin-bottom: 10px; }
        .brand { display: flex; gap: 16px; align-items: center; }
        .logo { width: 60px; height: 60px; border-radius: 12px; background: linear-gradient(135deg, var(--gold1), var(--gold2)); display: flex; align-items: center; justify-content: center; color: #0b0b0d; font-family: var(--ff-heading); font-size: 20px; font-weight: 700; box-shadow: 0 6px 22px rgba(212, 175, 55, 0.12); flex-shrink: 0; }
        .brand-text h1 { margin: 0; font-family: var(--ff-heading); font-size: 20px; letter-spacing: 0.6px; }
        .brand-text p { margin: 2px 0 0 0; color: var(--muted); font-size: 13px; }
        .search-container { background: var(--glass); backdrop-filter: blur(6px); padding: 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.03); display: flex; gap: 10px; align-items: center; width: 100%; }
        .search-container input { background: transparent; border: 0; outline: 0; color: inherit; font-size: 16px; width: 100%; }

        .tabs-container { margin-bottom: 10px; }
        .tabs-scroll { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0; justify-content: center; }
        .tab { padding: 10px 16px; border-radius: 999px; background: transparent; border: 1px solid rgba(255, 255, 255, 0.03); font-size: 14px; color: var(--muted); cursor: pointer; white-space: nowrap; transition: all 0.3s ease; margin: 2px; }
        .tab.active { background: linear-gradient(90deg, var(--gold1), var(--gold2)); color: #0b0b0d; border: none; box-shadow: 0 8px 30px rgba(212, 175, 55, 0.12); }
        @media (max-width: 767px) { .tab { padding: 8px 14px; font-size: 13px; } .tabs-scroll { justify-content: center; } }

        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 20px; }
        .card { background: linear-gradient(180deg, rgba(255, 255, 255, 0.015), rgba(255, 255, 255, 0.01)); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; border: 1px solid rgba(255, 255, 255, 0.03); transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.2, 1); }
        .card:hover { transform: translateY(-5px); }
        .card-header { display: flex; gap: 12px; }
        .thumb { width: 180px; height: 180px; border-radius: 10px; overflow: hidden; flex-shrink: 0; border: 1px solid rgba(255, 255, 255, 0.03); }
        .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
        .card:hover .thumb img { transform: scale(1.06); }
        .card-info { flex: 1; }
        .dish { font-size: 16px; font-weight: 600; margin: 0 0 4px 0; font-family: var(--ff-heading); }
        .desc { color: var(--muted); font-size: 13px; margin-top: 4px; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .price { font-weight: 700; font-size: 16px; color: var(--gold2); }
        .tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .pill { padding: 4px 8px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.03); font-size: 11px; color: var(--muted); }

        .btn-primary { background: linear-gradient(90deg, var(--gold1), var(--gold2)); border: none; padding: 8px 16px; border-radius: 8px; color: #0b0b0d; font-weight: 700; cursor: pointer; font-size: 13px; transition: all 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); }
        .cart-container { position: fixed; bottom: 20px; right: 20px; z-index: 100; }
        .cart-button { background: linear-gradient(90deg, var(--gold1), var(--gold2)); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; border: none; }
        .cart-count { position: absolute; top: -5px; right: -5px; background: #e74c3c; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
        .cart-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 11, 13, 0.95); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s; padding: 16px; }
        .cart-modal.open { opacity: 1; visibility: visible; }
        .cart-content { background: var(--surface); width: 100%; max-width: 500px; border-radius: var(--card-radius); padding: 20px; max-height: 80vh; overflow-y: auto; border: 1px solid rgba(255, 255, 255, 0.03); }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); padding-bottom: 12px; }
        .cart-title { font-family: var(--ff-heading); font-size: 22px; color: var(--gold2); }
        .close-cart { background: transparent; border: none; color: var(--muted); font-size: 24px; cursor: pointer; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
        .item-name { font-weight: 600; margin: 0 0 4px 0; font-size: 15px; }
        .item-price { color: var(--gold2); font-size: 14px; }
        .item-quantity { display: flex; align-items: center; gap: 10px; }
        .quantity-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.03); color: var(--muted); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
        .remove-item { background: transparent; border: none; color: #e74c3c; cursor: pointer; font-size: 18px; }
        .cart-total { display: flex; justify-content: space-between; padding: 16px 0; border-top: 1px solid rgba(255, 255, 255, 0.03); font-weight: 600; font-size: 18px; }
        .total-amount { color: var(--gold2); }
        .cart-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }

        .delivery-options { margin: 20px 0; padding: 20px; background: rgba(255, 255, 255, 0.015); border-radius: 10px; }
        .options-title { font-family: var(--ff-heading); font-size: 18px; margin-bottom: 15px; color: var(--gold2); display: flex; align-items: center; gap: 10px; }
        .delivery-option-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .option-btn { flex: 1; padding: 12px; border-radius: 8px; background: transparent; border: 2px solid rgba(255, 255, 255, 0.08); color: var(--muted); font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .option-btn.active { background: linear-gradient(90deg, rgba(212, 175, 55, 0.1), rgba(255, 204, 102, 0.1)); border-color: var(--gold1); color: var(--gold2); }
        .delivery-form { display: none; animation: fadeIn 0.5s ease; }
        .delivery-form.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--muted); font-size: 14px; }
        .form-input { width: 100%; padding: 12px 16px; border-radius: 8px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); color: white; font-size: 16px; }
        .form-input:focus { outline: none; border-color: var(--gold2); }
        .customer-details-summary { background: rgba(255, 255, 255, 0.02); border-radius: 8px; padding: 15px; margin: 15px 0; border: 1px solid rgba(255, 255, 255, 0.03); display: none; }
        .customer-details-summary.active { display: block; }
        .summary-title { font-weight: 600; color: var(--gold2); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .btn-add-another, .btn-clear, .btn-whatsapp { padding: 12px 14px; border-radius: 12px; font-weight: 700; cursor: pointer; text-align: center; }
        .btn-add-another { background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.3); color: var(--gold2); }
        .btn-clear { background: transparent; border: 1px solid rgba(255, 255, 255, 0.04); color: var(--muted); }
        .btn-whatsapp { background: #25D366; border: none; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .footer { text-align: center; padding: 20px 0; color: var(--muted); font-size: 14px; border-top: 1px solid rgba(255, 255, 255, 0.03); margin-top: 20px; }
        @media (min-width: 768px) { .menu-grid { grid-template-columns: repeat(2, 1fr); } .cart-actions { flex-direction: row; } }
        @media (min-width: 1024px) { .menu-grid { grid-template-columns: repeat(3, 1fr); } }
    </style>
</head>
<body>
<div class="container">  
    <div class="cafe-header">
        <img src="logo.jpeg" alt="Logo" style="width:400px; height:auto; display:block; margin:0 auto;">
        <div class="cafe-name"></div>
        <div class="cafe-subtitle"></div>
        <div class="location-info">
            <div class="location-text">Delicious Authentic Indian Cuisine Delivered to Your Doorstep</div>
            <div class="address"></div>
            <p><span style="color: #ffffff; font-weight: bold; font-size: 18px;">Mo No. +91 9649791949 / 9511112364</span></p>
            <div class="mobile-numbers"><br></div>
        </div>
        <div class="veg-nonveg"><div class="veg"><span class="symbol"></span><span>VEG</span></div><div class="nonveg"><span class="symbol"></span><span>NON VEG</span></div></div>
    </div>

    <button onclick="openSuggestionForm()" style="background:linear-gradient(135deg,#d4af37,#f5d76e); color:#000; padding:12px 28px; border:none; border-radius:30px; font-size:16px; font-weight:700; cursor:pointer; display:block; margin:20px auto;">💡 Suggestion & Feedback</button>

    <div id="suggestionModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:99999; justify-content:center; align-items:center;">
        <div style="background:#111; width:90%; max-width:450px; padding:25px; border-radius:20px; border:2px solid #d4af37;">
            <h2 style="text-align:center; color:#d4af37;">💡 Suggestion Form</h2>
            <input type="text" id="sugName" placeholder="Your Name" style="width:100%; padding:12px; margin-bottom:12px; background:#1a1a1a; color:white; border:1px solid #d4af37; border-radius:10px;">
            <input type="tel" id="sugMobile" placeholder="Mobile Number" style="width:100%; padding:12px; margin-bottom:12px; background:#1a1a1a; color:white; border:1px solid #d4af37; border-radius:10px;">
            <input type="text" id="sugAddress" placeholder="Address" style="width:100%; padding:12px; margin-bottom:12px; background:#1a1a1a; color:white; border:1px solid #d4af37; border-radius:10px;">
            <label style="color:#d4af37;">🎂 Date of Birth</label>
            <input type="date" id="sugDOB" style="width:100%; padding:12px; margin-bottom:12px; background:#1a1a1a; color:white; border:1px solid #d4af37; border-radius:10px;">
            <label style="color:#d4af37;">💍 Anniversary Date</label>
            <input type="date" id="sugAnniversary" style="width:100%; padding:12px; margin-bottom:12px; background:#1a1a1a; color:white; border:1px solid #d4af37; border-radius:10px;">
            <textarea id="sugText" placeholder="Write your suggestion..." rows="4" style="width:100%; padding:12px; margin-bottom:15px; background:#1a1a1a; color:white; border:1px solid #d4af37; border-radius:10px;"></textarea>
            <div style="display:flex; gap:10px;"><button onclick="sendSuggestion()" style="flex:1; background:#25D366; color:white; padding:12px; border:none; border-radius:10px; font-weight:bold;">Submit</button><button onclick="closeSuggestionForm()" style="flex:1; background:#dc3545; color:white; padding:12px; border:none; border-radius:10px; font-weight:bold;">Close</button></div>
        </div>
    </div>

    <div style="display:flex; justify-content:center; gap:25px; margin-top:30px;">
        <a href="https://www.instagram.com/naivedyamcloudkitchen?igsh=YXhiYTJraHVwZDBl&utm_source=qr" target="_blank" style="width:70px; height:70px; background:#E1306C; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:32px; text-decoration:none;"><i class="fab fa-instagram"></i></a>
        <a href="https://www.facebook.com/share/1CJW22QSou/?mibextid=wwXIfr" target="_blank" style="width:70px; height:70px; background:#1877F2; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:32px; text-decoration:none;"><i class="fab fa-facebook-f"></i></a>
    </div>
    <p style="text-align:center; margin-top:10px; font-size:14px; color:white;">Delivery free up to 3 Km</p>
          
    <main class="menu">
        <div class="menu-head">
            <div class="controls">
                <div class="search" role="search">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.35-4.35" stroke="rgba(255,255,255,0.6)" stroke-width="1.6"/><circle cx="11" cy="11" r="6" stroke="rgba(255,255,255,0.6)" stroke-width="1.6"/></svg>
                    <input id="search" placeholder="Search dishes, ingredients..." />
                </div>
                <div class="tabs-scroll">
                    <button class="tab active" data-cat="all">🍽️ All Items</button>
                    <button class="tab" data-cat="Veg Soup">🥣 Veg Soup</button><button class="tab" data-cat="Bitings">🍿 Bitings</button>
                    <button class="tab" data-cat="Veg Starters">🥗 Veg Starters</button><button class="tab" data-cat="Vegetarian Special">🥦 Vegetarian Special</button>
                    <button class="tab" data-cat="Paneer Special">🧀 Paneer Special</button><button class="tab" data-cat="Maharashtra Special">🚩 Maharashtra Special</button>
                    <button class="tab" data-cat="Dal Preparation">🍲 Dal Preparation</button><button class="tab" data-cat="Rice Preparation">🍚 Rice Preparation</button>
                    <button class="tab" data-cat="Chinese Starters">🥢 Chinese Starters</button><button class="tab" data-cat="Indian Breads">🫓 Indian Breads</button>
                    <button class="tab" data-cat="Non Veg Soup">🥣 Non Veg Soup</button><button class="tab" data-cat="Non Veg Starters">🍤 Non Veg Starters</button>
                    <button class="tab" data-cat="Non Veg Kababs">🍢 Non Veg Kababs</button><button class="tab" data-cat="Non Veg Special">🍗 Non Veg Special</button>
                    <button class="tab" data-cat="Mutton Special">🍖 Mutton Special</button><button class="tab" data-cat="Non Veg Rice Preparation">🍛 Non Veg Rice</button>
                    <button class="tab" data-cat="Chinese Main Course">🍜 Chinese Main Course</button> 
                </div>
            </div>
        </div>
        <section class="menu-grid" id="menuGrid"></section>
    </main>

    <div class="location-link-section">
        <div class="location-link-header"><svg class="location-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg><h3>Find Us on Google Maps</h3></div>
        <div class="map-link-container"><a href="https://maps.app.goo.gl/Aoxkz9BwjmvNWXhb6" target="_blank" class="map-link">📍 Open in Google Maps</a></div>
    </div>
</div> 

<div class="cart-container"><button class="cart-button" id="cartButton"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span class="cart-count" id="cartCount">0</span></button></div>

<div class="cart-modal" id="cartModal">
    <div class="cart-content">
        <div class="cart-header"><h3 class="cart-title">Your Order</h3><button class="close-cart" id="closeCart">&times;</button></div>
        <div class="delivery-options">
            <h4 class="options-title"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg> Select Delivery Type</h4>
            <div class="delivery-option-buttons">
                <button class="option-btn active" id="restaurantOption">🏪 Restaurant</button>
                <button class="option-btn" id="homeDeliveryOption">🏠 Home Delivery</button>
            </div>
            <div class="delivery-form active" id="restaurantForm"><div class="form-group"><label class="form-label">Table Number</label><input type="text" id="tableNumber" class="form-input" placeholder="Enter your table number (e.g., Table 5)" /></div></div>
            <div class="delivery-form" id="homeDeliveryForm">
                <div class="form-group"><label class="form-label">Full Name</label><input type="text" id="customerName" class="form-input" placeholder="Enter your full name" /></div>
                <div class="form-group"><label class="form-label">Mobile Number</label><input type="tel" id="customerMobile" class="form-input" placeholder="Enter your mobile number" /></div>
                <div class="form-group"><label class="form-label">Delivery Address</label><textarea id="customerAddress" class="form-input" placeholder="Enter your complete address" rows="3"></textarea></div>
            </div>
        </div>
        <div class="customer-details-summary" id="customerDetailsSummary"></div>
        <div class="cart-items" id="cartItems"><div class="cart-empty" id="cartEmpty">Your cart is empty</div></div>
        <div class="cart-total"><span>Total:</span><span class="total-amount" id="cartTotal">₹0</span></div>
        <div class="cart-actions">
            <button class="btn-add-another" id="addAnotherItem">➕ Add another Item</button>

    let cart = [];
    let deliveryType = 'restaurant';
    const cartModal = document.getElementById('cartModal');
    const cartCount = document.getElementById('cartCount');
    const cartItemsDiv = document.getElementById('cartItems');
    const cartTotalSpan = document.getElementById('cartTotal');
    const customerSummary = document.getElementById('customerDetailsSummary');

    function extractPrice(priceStr) { let m = priceStr.match(/\d+/); return m ? parseInt(m[0]) : 0; }
    function updateCartUI() {
        let total = 0, qty = 0;
        if (cart.length === 0) { cartItemsDiv.innerHTML = '<div class="cart-empty">Your cart is empty</div>'; cartTotalSpan.innerText = '₹0'; cartCount.innerText = '0'; return; }
        let html = '';
        cart.forEach(item => {
            let priceVal = extractPrice(item.price);
            let itemTotal = priceVal * item.quantity;
            total += itemTotal; qty += item.quantity;
            html += `<div class="cart-item"><div class="item-info"><div class="item-name">${item.name}</div><div class="item-price">${item.price}</div></div><div class="item-quantity"><button class="quantity-btn" onclick="updateQuantity(${item.id}, -1)">-</button><span class="quantity">${item.quantity}</span><button class="quantity-btn" onclick="updateQuantity(${item.id}, 1)">+</button><button class="remove-item" onclick="removeFromCart(${item.id})">×</button></div></div>`;
        });
        cartItemsDiv.innerHTML = html;
        cartTotalSpan.innerText = `₹${total}`;
        cartCount.innerText = qty;
    }
    function addToCart(item, btn) { let existing = cart.find(i => i.id === item.id); if(existing) existing.quantity++; else cart.push({...item, quantity:1}); updateCartUI(); if(btn) { btn.innerText = '✓ Added'; setTimeout(() => btn.innerText = 'Add to Cart', 800); } }
    window.removeFromCart = (id) => { cart = cart.filter(i => i.id !== id); updateCartUI(); updateCustomerSummary(); };
    window.updateQuantity = (id, delta) => { let idx = cart.findIndex(i => i.id === id); if(idx !== -1) { cart[idx].quantity += delta; if(cart[idx].quantity <= 0) cart.splice(idx,1); updateCartUI(); updateCustomerSummary(); } };
    function updateCustomerSummary() {
        let show = false, html = '';
        if(deliveryType === 'restaurant') {
            let table = document.getElementById('tableNumber').value.trim();
            if(table) { show=true; html = `<div class="summary-title">🏪 Restaurant Order</div><div><strong>Table:</strong> ${table}</div>`; }
        } else {
            let name = document.getElementById('customerName').value.trim(), mobile = document.getElementById('customerMobile').value.trim(), addr = document.getElementById('customerAddress').value.trim();
            if(name || mobile || addr) { show=true; html = `<div class="summary-title">🚚 Home Delivery</div><div>${name ? `<strong>Name:</strong> ${name}<br>` : ''}${mobile ? `<strong>Mobile:</strong> ${mobile}<br>` : ''}${addr ? `<strong>Address:</strong> ${addr}` : ''}</div>`; }
        }
        if(show) { customerSummary.innerHTML = html; customerSummary.classList.add('active'); } else customerSummary.classList.remove('active');
    }
    function selectDeliveryOption(type) {
        deliveryType = type;
        document.getElementById('restaurantOption').classList.toggle('active', type === 'restaurant');
        document.getElementById('homeDeliveryOption').classList.toggle('active', type === 'home');
        document.getElementById('restaurantForm').classList.toggle('active', type === 'restaurant');
        document.getElementById('homeDeliveryForm').classList.toggle('active', type === 'home');
        updateCustomerSummary();
    }
    document.getElementById('cartButton').onclick = () => { cartModal.classList.add('open'); updateCustomerSummary(); };
    document.getElementById('closeCart').onclick = () => cartModal.classList.remove('open');
    document.getElementById('clearCart').onclick = () => { cart = []; updateCartUI(); updateCustomerSummary(); };
    document.getElementById('addAnotherItem').onclick = () => { cartModal.classList.remove('open'); document.getElementById('search').focus(); };
    document.getElementById('restaurantOption').onclick = () => selectDeliveryOption('restaurant');
    document.getElementById('homeDeliveryOption').onclick = () => selectDeliveryOption('home');
    document.getElementById('tableNumber').addEventListener('input', updateCustomerSummary);
    document.getElementById('customerName').addEventListener('input', updateCustomerSummary);
    document.getElementById('customerMobile').addEventListener('input', updateCustomerSummary);
    document.getElementById('customerAddress').addEventListener('input', updateCustomerSummary);
    
    document.getElementById('whatsappOrder').onclick = () => {
        if(cart.length === 0) { alert('Your cart is empty!'); return; }
        let isValid = true;
        if(deliveryType === 'restaurant') {
            if(!document.getElementById('tableNumber').value.trim()) { isValid=false; alert('Please enter table number'); }
        } else {
            let name = document.getElementById('customerName').value.trim(), mobile = document.getElementById('customerMobile').value.trim(), addr = document.getElementById('customerAddress').value.trim();
            if(!name || !mobile || !addr) { isValid=false; alert('Please fill all delivery details (Name, Mobile, Address)'); }
        }
        if(!isValid) return;
        let message = `🍽️ *Naivedyam Order* 🍽️\n\n`;
        if(deliveryType === 'restaurant') { message += `📍 *Type:* Dine-in\n📋 *Table:* ${document.getElementById('tableNumber').value.trim()}\n\n`; }
        else { message += `🚚 *Type:* Home Delivery\n👤 *Name:* ${document.getElementById('customerName').value.trim()}\n📞 *Mobile:* ${document.getElementById('customerMobile').value.trim()}\n🏠 *Address:* ${document.getElementById('customerAddress').value.trim()}\n\n`; }
        message += `🛒 *Order Items:*\n`;
        let total = 0;
        cart.forEach(item => { let priceVal = extractPrice(item.price); total += priceVal * item.quantity; message += `▸ ${item.name} — ${item.quantity} x ${item.price}\n`; });
        message += `\n💰 *Total Amount:* ₹${total}\n🙏 Thank you!`;
        window.open(`https://wa.me/919649791949?text=${encodeURIComponent(message)}`, '_blank');
        cartModal.classList.remove('open');
    };
    function renderMenu(items) {
        const grid = document.getElementById('menuGrid');
        if(!items.length) { grid.innerHTML = '<p style="text-align:center;color:var(--muted);">No items found</p>'; return; }
        grid.innerHTML = items.map(item => `<div class="card"><div class="card-header"><div class="thumb"><img src="${item.img}" alt="${item.name}" onerror="this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22180%22%20height%3D%22180%22%20viewBox%3D%220%200%20180%20180%22%3E%3Crect%20width%3D%22180%22%20height%3D%22180%22%20fill%3D%22%23111111%22%2F%3E%3Ctext%20x%3D%2290%22%20y%3D%2290%22%20text-anchor%3D%22middle%22%20fill%3D%22%23888%22%3ENo%20Image%3C%2Ftext%3E%3C%2Fsvg%3E'"></div><div class="card-info"><h3 class="dish">${item.name}</h3><p class="desc">${item.desc}</p><div class="tags">${item.tags.map(t=>`<span class="pill">${t}</span>`).join('')}</div></div></div><div class="card-footer"><div class="price">${item.price}</div><button class="btn-primary" onclick="addToCart({id:${item.id},name:'${item.name.replace(/'/g,"\\'")}',price:'${item.price}'}, this)">Add to Cart</button></div></div>`).join('');
    }
    function filterByCat(cat) { renderMenu(cat === 'all' ? data : data.filter(i => i.cat === cat)); }
    document.querySelectorAll('.tab').forEach(tab => { tab.addEventListener('click', () => { document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); filterByCat(tab.dataset.cat); }); });
    document.getElementById('search').addEventListener('input', (e) => { let q = e.target.value.toLowerCase(); renderMenu(data.filter(i => i.name.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q) || i.tags.some(t=>t.toLowerCase().includes(q)))); });
    renderMenu(data);
    selectDeliveryOption('restaurant');
    window.openSuggestionForm = () => document.getElementById('suggestionModal').style.display = 'flex';
    window.closeSuggestionForm = () => document.getElementById('suggestionModal').style.display = 'none';
    window.sendSuggestion = () => {
        let name = document.getElementById('sugName').value.trim(), mob = document.getElementById('sugMobile').value.trim(), addr = document.getElementById('sugAddress').value.trim(), dob = document.getElementById('sugDOB').value, ann = document.getElementById('sugAnniversary').value, sug = document.getElementById('sugText').value.trim();
        if(!name || !mob) { alert("Please enter Name and Mobile"); return; }
        let msg = `💡 New Customer Feedback\n👤 Name: ${name}\n📱 Mobile: ${mob}\n📍 Address: ${addr || "Not Provided"}\n🎂 DOB: ${dob || "Not Provided"}\n💍 Anniversary: ${ann || "Not Provided"}\n📝 Suggestion: ${sug || "No Suggestion"}`;
        window.open(`https://wa.me/919649791949?text=${encodeURIComponent(msg)}`, '_blank');
        closeSuggestionForm();
    };
